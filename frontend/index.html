<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="ADEENA TRADERS - Professional Business Management System for Installments, Inventory, Sales, and Zakat" />
    <meta name="theme-color" content="#0a0a0c" />

    <!-- Paint in the remembered theme from the first frame. Without this the
         page shows Royal Gold for a moment before a blue or green theme loads.
         Keep the ids in step with src/theme/themes.js. -->
    <script>
      try {
        var t = localStorage.getItem('at_theme');
        if (['gold', 'blue', 'green', 'red', 'purple'].indexOf(t) > -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>

    <!-- Google Fonts: Inter + Plus Jakarta Sans + Cinzel (the ADEENA TRADERS
         wordmark) + Noto Nastaliq Urdu.
         Nastaliq is a large face, so it is loaded in two weights only and with
         display=swap - the Latin text must never wait on it to paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Cinzel:wght@600;700;800&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet" />

    <title>ADEENA TRADERS - Business Management System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
